name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# 同一分支的新 push 取消仍在跑的旧 run，避免队列堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false          # 矩阵里任一格失败不影响其它格的结果可见性
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20         # 核心层测试只要十几秒，卡住说明出了问题

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 关键：requirements-dev.txt 必须是合法的 pip requirements 文件。
          # 它内部是 `-r requirements.txt` + `-e .[web,mcp,ai]` + 测试工具，
          # 装的是本项目本体加运行时可选能力 —— 否则 test_web / test_mcp /
          # test_ai 会被 importorskip 跳过或因缺 httpx 在收集阶段就报错。
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check log_ai_compressor tests scripts

      - name: Unit & integration tests with coverage
        # 用 python 承载这段逻辑，而不是 shell：
        # Windows runner 的默认 shell 是 pwsh，`if !` / `2>/dev/null` 这类
        # bash 语法会直接 ParserError（run #159 就栽在这里）。`shell: python`
        # 在三个平台上行为一致。
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          # mcp SDK 要求 Python >= 3.10。3.9 上装不上、tests/test_mcp.py 会
          # 整体 importorskip 跳过，此时把 mcp 包移出覆盖率口径 ——
          # 跑不了的代码不该把门槛拖到不及格；在装得上的矩阵上必须计入，
          # 否则覆盖率就成了一个没人看的数字。
          # （pytest-cov 没有 --cov-omit 参数，只能换一份 coveragerc）
          extra = []
          try:
              __import__("mcp")
          except ImportError:
              pathlib.Path(".coveragerc.ci").write_text(
                  "[run]\nomit =\n"
                  "    log_ai_compressor/cli.py\n"
                  "    log_ai_compressor/mcp/*\n",
                  encoding="utf-8")
              extra = ["--cov-config=.coveragerc.ci"]
              print("::notice::mcp 不可用（Python 版本过低），本次不计入 mcp 覆盖率")

          code = subprocess.call([
              sys.executable, "-m", "pytest",
              "--cov=log_ai_compressor", *extra,
              "--cov-report=term-missing",
              "--cov-report=xml",
              "--cov-fail-under=90",
          ])
          pathlib.Path(".coveragerc.ci").unlink(missing_ok=True)
          sys.exit(code)

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
